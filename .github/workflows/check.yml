name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Matches the uv_build pin in every member pyproject.
          version: "0.12.3"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --frozen

      # The Firestore emulator is a Java process that firebase-tools fetches.
      # Both are needed for the emulator-backed tests and for `make e2e`;
      # without them those 40-odd tests skip and CI would pass while proving
      # nothing about the guardrail.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install firebase-tools
        run: npm install --global firebase-tools@15

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint
        run: make lint

      - name: Types
        run: make types

      - name: Types (web)
        run: npx --prefix web tsc --noEmit --project web

      - name: Wall-clock guard
        run: make guard

      # The same target `make check` runs, so a green CI and a green laptop mean
      # the same thing. It boots the emulators and treats a skip as a failure —
      # a run that quietly skipped every guardrail test looks like coverage.
      - name: Tests
        run: make test-all

      # The only thing in the repo that executes the rules files. Everything
      # else reaches Firestore through the admin SDK, which bypasses them.
      - name: Security rules
        run: make rules-test

      - name: End to end
        run: make e2e

      # The panel is deployed straight from web/dist by `make deploy-web`, so a
      # build that only ever runs on the way to Firebase Hosting is a build
      # that fails at the worst moment. tsc above type-checks it; this proves
      # it bundles.
      - name: Web builds
        run: make web-build

      # Neither a Docker daemon nor gcloud exists on the machine this was
      # written on, so CI is where the image is actually verified. Without this
      # step the Dockerfile would be a file nobody has ever run, discovered to
      # be broken on the day it is first needed.
      - name: Image builds
        run: make image

      # And that it starts and answers. A build that succeeds and then dies on
      # import — a runtime dependency pruned by --no-dev, a bad entrypoint —
      # reaches Cloud Run as a cold-start timeout with nothing useful in the
      # log, which is a miserable thing to debug at a distance.
      #
      # FIRESTORE_EMULATOR_HOST is set only so the Firestore client uses
      # anonymous credentials instead of looking for ADC that do not exist on a
      # CI runner. Nothing is listening there and nothing needs to be: /health
      # reports configuration and touches no collection.
      - name: Image serves
        run: |
          docker run -d --name tick -p 8080:8080 \
            -e CINEMA_GCP_PROJECT=demo-cinema \
            -e FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 \
            greenlit:local
          for _ in $(seq 30); do
            curl -fsS localhost:8080/health >/dev/null 2>&1 && break || sleep 1
          done
          curl -fsS localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'
          docker logs tick
          docker rm -f tick
