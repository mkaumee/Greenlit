[project]
name = "orchestrator"
version = "0.1.0"
description = "Role B runtime: clock, Firestore, Gmail, state machine, tick loop."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cinema-contracts",
    "google-cloud-firestore>=2.19",
    # 2.35.0 changes gRPC metadata ordering and breaks the Firestore
    # Emulator's handling of the "(default)" database routing header.
    "google-api-core>=2.26,<2.35",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-cloud-secret-manager>=2.20",
    "firebase-admin>=7.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    # Role A's brain. A real dependency rather than an optional extra: the
    # image has to carry google-adk and parallel-web or
    # CINEMA_BRAIN_BACKEND=main-agent fails at import, and the whole point of
    # that failing at startup is that it is loud. The orchestrator still never
    # imports main_agent statically — build_brain() resolves it by name, so the
    # scripted default needs none of this at runtime.
    "main-agent",
]

[tool.uv.sources]
main-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
