[project]
name = "main-agent"
version = "0.1.0"
description = "Stateless Gemini reasoning service for cinema procurement."
readme = "README.md"
authors = [
    { name = "BlueGecko", email = "kei09doya@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cinema-contracts",
    "google-adk>=2.7.0",
    "parallel-web>=1.3.0",
]

[tool.uv.sources]
cinema-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "A",
    "C4",
    "T10",
    "ISC",
    "PIE",
    "RSE",
    "RET",
    "SIM",
    "PERF",
    "RUF",
    "N",
    "PLE",
    "PLW",
]

ignore = [
    "E501",
    "ISC001",
    "COM812",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
typeCheckingMode = "recommended"
pythonVersion = "3.14"
