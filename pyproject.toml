# uv workspace root. Not a package itself.
#
# `main-agent` (Role A) joins this members list when role_a and role_b merge.
# It is absent here only because it does not exist on this branch yet.
[tool.uv.workspace]
members = ["contracts", "orchestrator", "supplier-sim"]

[tool.uv.sources]
cinema-contracts = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.16.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# Ruff and basedpyright are configured here at the root and inherited by every
# member package, so the two halves of the codebase cannot drift on style.
# These settings match main-agent/pyproject.toml exactly, plus the TID and DTZ
# rules that enforce Hard Rule 2 (no wall-clock time).
[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "A",
    "C4",
    "T10",
    "ISC",
    "PIE",
    "RSE",
    "RET",
    "SIM",
    "PERF",
    "RUF",
    "N",
    "PLE",
    "PLW",
    "TID",
    "DTZ",
]

ignore = [
    "E501",
    "ISC001",
    "COM812",
]

# Hard Rule 2, enforced by the linter rather than by code review.
# scripts/check_no_wallclock.py is the belt-and-braces version that also catches
# aliased imports.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Wall-clock time is banned. Use clock.now() — see CLAUDE.md."
"datetime.datetime.utcnow".msg = "Wall-clock time is banned. Use clock.now() — see CLAUDE.md."
"datetime.datetime.today".msg = "Wall-clock time is banned. Use clock.now() — see CLAUDE.md."
"time.time".msg = "Wall-clock time is banned. Use clock.now() — see CLAUDE.md."
"time.monotonic".msg = "Wall-clock time is banned. Use clock.now() — see CLAUDE.md."

[tool.ruff.lint.per-file-ignores]
# The guard script names the banned functions in order to detect them.
"scripts/check_no_wallclock.py" = ["TID251"]
# Deliberately no exemption for orchestrator/clock.py. Its single wall-clock
# read carries an inline noqa instead, so a second one cannot be added there
# without another visible suppression.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
typeCheckingMode = "recommended"
pythonVersion = "3.14"
include = ["contracts", "orchestrator", "supplier-sim", "scripts"]
exclude = ["**/node_modules", "**/.venv", "**/__pycache__"]
# scripts/ holds standalone tools that CI runs without installing anything.
# Putting it on the path lets tests import them with real types instead of
# loading them by filename and casting.
extraPaths = ["scripts", "orchestrator/tests"]

# Ruff already ignores ISC001, so implicit concatenation is a deliberate team
# choice. Leaving this on would make the two tools disagree about the same code.
reportImplicitStringConcatenation = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["contracts/tests", "orchestrator/tests", "supplier-sim/tests"]
pythonpath = ["scripts", "orchestrator/tests"]
# orchestrator/tests is on the path so a test can import the emulator helpers
# from conftest by name rather than relying on pytest's rootdir insertion,
# which basedpyright cannot see.
